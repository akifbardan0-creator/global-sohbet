<!DOCTYPE html>
<html lang="tr">
<head>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300ff66;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23009933;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23121212' stroke='%2300ff66' stroke-width='4'/%3E%3Cpath d='M16 20C16 17.7909 17.7909 16 20 16H44C46.2091 16 48 17.7909 48 20V38C48 40.2091 46.2091 42 44 42H32L22 50V42H20C17.7909 42 16 40.2091 16 38V20Z' fill='url(%23grad)'/%3E%3Ccircle cx='26' cy='29' r='3' fill='%23121212'/%3E%3Ccircle cx='32' cy='29' r='3' fill='%23121212'/%3E%3Ccircle cx='38' cy='29' r='3' fill='%23121212'/%3E%3C/svg%3E">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Sepet - Gizli Mesajlaşma</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #00ff66;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #00ff66;
            color: #00ff66;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #00ff66;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #00cc52;
        }
        #chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 15px;
            background: #0a0a0a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 12px;
            border-bottom: 1px dashed #333;
            padding-bottom: 6px;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #ffcc00;
            margin-bottom: 4px;
        }
        .msg-body {
            word-break: break-all;
        }
        .settings {
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔒 Bizim Sepet - GitHub Sync</h2>
    
    <!-- Ayar Paneli -->
    <div class="settings">
        <details>
            <summary style="cursor: pointer; color: #ffcc00;">GitHub ve Profil Ayarları (Tıkla Aç)</summary>
            <input type="text" id="chat-username" placeholder="Sohpetteki Adın (Örn: Akif)">
            <input type="text" id="username" placeholder="GitHub Kullanıcı Adı" value="akifbardan0-creator">
            <input type="text" id="repo" placeholder="Depo Adı (Repo)" value="global-sohpet">
            <input type="text" id="filepath" placeholder="Dosya Yolu" value="chat.json">
            <input type="password" id="token" placeholder="GitHub Token (ghp_...)">
            <button onclick="saveSettings()">Ayarları Kaydet</button>
        </details>
    </div>

    <!-- Mesaj Akışı -->
    <div id="chat-box">Mesajlar yükleniyor...</div>

    <!-- Mesaj Gönderme Alanı -->
    <textarea id="msg-input" placeholder="Mesajını yaz kanka..."></textarea>
    <button onclick="sendMessage()">Gönder</button>
</div>

<script>
    let fileSha = ""; 

    function getSettings() {
        return {
            chatUser: document.getElementById('chat-username').value || localStorage.getItem('chat_user') || 'Gizli',
            username: document.getElementById('username').value || localStorage.getItem('gh_user'),
            repo: document.getElementById('repo').value || localStorage.getItem('gh_repo'),
            filepath: document.getElementById('filepath').value || 'chat.json',
            token: document.getElementById('token').value || localStorage.getItem('gh_token')
        };
    }

    function saveSettings() {
        localStorage.setItem('chat_user', document.getElementById('chat-username').value);
        localStorage.setItem('gh_user', document.getElementById('username').value);
        localStorage.setItem('gh_repo', document.getElementById('repo').value);
        localStorage.setItem('gh_path', document.getElementById('filepath').value);
        localStorage.setItem('gh_token', document.getElementById('token').value);
        alert("Ayarlar kaydedildi kanka!");
        loadMessages();
    }

    window.onload = () => {
        if(localStorage.getItem('chat_user')) document.getElementById('chat-username').value = localStorage.getItem('chat_user');
        if(localStorage.getItem('gh_user')) document.getElementById('username').value = localStorage.getItem('gh_user');
        if(localStorage.getItem('gh_repo')) document.getElementById('repo').value = localStorage.getItem('gh_repo');
        if(localStorage.getItem('gh_path')) document.getElementById('filepath').value = localStorage.getItem('gh_path');
        if(localStorage.getItem('gh_token')) document.getElementById('token').value = localStorage.getItem('gh_token');

        loadMessages();
        setInterval(loadMessages, 5000); 
    };

    async function loadMessages() {
        const s = getSettings();
        if (!s.token) {
            document.getElementById('chat-box').innerHTML = "Önce yukarıdan GitHub token'ını gir kanka!";
            return;
        }

        const url = `https://api.github.com/repos/${s.username}/${s.repo}/contents/${s.filepath}`;
        
        try {
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${s.token}` }
            });

            if (response.status === 404) {
                document.getElementById('chat-box').innerHTML = "chat.json henüz yok. İlk mesajı atınca otomatik oluşacak.";
                return;
            }

            const data = await response.json();
            fileSha = data.sha; 
            
            const jsonString = decodeURIComponent(escape(atob(data.content)));
            const messages = JSON.parse(jsonString);

            let html = "";
            messages.forEach(m => {
                html += `<div class="message">
                    <div class="msg-header">
                        <span><b>${m.user || 'Anonim'}</b></span>
                        <span>${m.time}</span>
                    </div>
                    <div class="msg-body">${m.text}</div>
                </div>`;
            });
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = html;
            chatBox.scrollTop = chatBox.scrollHeight; 

        } catch (error) {
            console.error("Mesajlar çekilemedi:", error);
        }
    }

    async function sendMessage() {
        const s = getSettings();
        const textInput = document.getElementById('msg-input');
        const text = textInput.value.trim();

        if (!text) return;
        if (!s.token) {
            alert("Önce GitHub token'ını girmelisin kanka!");
            return;
        }

        const now = new Date();
        const timeStr = `${now.getDate().toString().padStart(2, '0')}.${(now.getMonth()+1).toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

        let messages = [];
        const url = `https://api.github.com/repos/${s.username}/${s.repo}/contents/${s.filepath}`;
        
        try {
            const res = await fetch(url, { headers: { 'Authorization': `token ${s.token}` } });
            if (res.ok) {
                const data = await res.json();
                fileSha = data.sha;
                messages = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            }
        } catch (e) {
            // Dosya yoksa boş dizi
        }

        messages.push({ user: s.chatUser, text: text, time: timeStr });

        const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(messages, null, 2))));

        const bodyData = {
            message: `${s.chatUser} mesaj gönderdi: ` + timeStr,
            content: encodedContent,
            sha: fileSha ? fileSha : undefined
        };

        const putRes = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${s.token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(bodyData)
        });

        if (putRes.ok) {
            textInput.value = "";
            loadMessages();
        } else {
            alert("Mesaj gönderilemedi kanka, token yetkisini veya depo adını kontrol et.");
        }
    }
</script>

</body>
</html>
